---
name: ci
on:
  pull_request:
  push:
    branches:
      - "release/**"
jobs:
  yamllint:
    uses: networkservicemesh/.github/.github/workflows/yamllint.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main

  build-and-test:
    uses: networkservicemesh/.github/.github/workflows/build-and-test.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'

  golangci-lint:
    uses: networkservicemesh/.github/.github/workflows/golangci-lint.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main
    with:
      linter-version: v1.53.3

  exclude-fmt-errorf:
    uses: networkservicemesh/.github/.github/workflows/exclude-fmt-errorf.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main

  restrict-nsm-deps:
    uses: networkservicemesh/.github/.github/workflows/restrict-nsm-deps.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main
    with:
      allowed_repositories: "api"

  checkgomod:
    uses: networkservicemesh/.github/.github/workflows/checkgomod.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main

  gogenerate:
    uses: networkservicemesh/.github/.github/workflows/sdk-gogenerate.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main

  exclude-replace:
    uses: networkservicemesh/.github/.github/workflows/exclude-replace.yaml@fe8cd964c2e13a408077d9a78b939934e3b4521f # main

  code-cov:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - name: Check out code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - name: Setup Go
        uses: actions/setup-go@0caeaed6fd66a828038c2da3c0f662a42862658f # v1
        with:
          go-version: 1.20.5
      - run: |
          go test -coverprofile=coverage-${{ matrix.os }}.txt -covermode=atomic -race ./...
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v3
